    UbahStatusRekomendasi:
      type: object
      required: [status, catatan]
      properties:
        status: { type: string, enum: [dikerjakan, selesai] }
        catatan: { type: string, maxLength: 140 }
        penanggung_jawab: { type: string }
        target_tanggal: { type: string, format: date }
    UmpanBalik:
      type: object
